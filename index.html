<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f5fa;color:#1a1a1a;font-size:14px}
.hd{background:#0b4f9c;color:#fff;padding:18px 20px}.hd b{font-size:17px}.hd div{font-size:12.5px;opacity:.85;margin-top:3px}
.wrap{max-width:620px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #d7deea;border-radius:10px;padding:16px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#4a5670}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13.5px}.kv span{color:#667}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.bal{display:flex;gap:10px;margin-top:12px}.bal div{flex:1;background:#eef3fb;border-radius:8px;padding:9px}.bal small{display:block;color:#667;font-size:11px;text-transform:uppercase}.bal b{font-size:16px}
label{display:block;font-size:12.5px;color:#4a5670;margin:10px 0 4px;font-weight:bold}
input,textarea{width:100%;padding:9px 10px;border:1px solid #c5cedd;border-radius:7px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{margin-top:16px;width:100%;background:#0b4f9c;color:#fff;border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.msg{padding:12px;border-radius:8px;margin-top:12px;font-size:13.5px}.ok{background:#e6f4ec;color:#1f6b43}.err{background:#fbe9e7;color:#b3261e}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:6px;border-bottom:1px solid #e4e8f0;text-align:left}

<div class="hd"><b>Payment Slip Upload</b><div>BYD Malaysia Sdn. Bhd. · DENZA Proforma Invoice</div></div>
<div class="wrap" id="app"></div>
<script>
var API='https://script.google.com/macros/s/AKfycbzkAUAQG-S5SeZaY51friOD_DwvDiyt9F-wAcO25aeVjKZCiC7tEB0vpnSeE66__rNDOw/exec';
var Q=new URLSearchParams(location.search);
function post(b){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(function(r){return r.json()})}
var A=document.getElementById('app');A.innerHTML='<div class="card" style="text-align:center;color:#667">Loading your Proforma Invoice…</div>';
post({action:'slipInfo',pi:Q.get('pi')||'',k:Q.get('k')||''}).then(function(C){start(C)}).catch(function(){A.innerHTML='<div class="card"><div class="msg err">Cannot load this page right now. Please check your internet connection and try again.</div></div>'});
function start(C){
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
if(!C.ok){A.innerHTML='<div class="card"><div class="msg err">'+e(C.msg)+'</div></div>'}
else{
 var today=new Date(Date.now()+8*3600e3).toISOString().slice(0,10),multi=C.pis.length>1,open=C.pis.filter(function(p){return !p.fullyPaid});
 var head;
 if(!multi){var P=C.pis[0];
  head='<div class="card"><h3>Proforma Invoice</h3><div class="kv"><span>PI number</span><b class="mono">'+e(P.no)+'</b><span>Dealer</span><div>'+e(C.dealer)+(P.outlet?'<br><small>'+e(P.outlet)+'</small>':'')+'</div><span>PI date</span><div>'+e(P.date)+'</div><span>Due date</span><div>'+e(P.due)+'</div>'+
  P.items.map(function(i){return '<span>Vehicle</span><div>'+e(i.model)+' · '+e(i.color)+'<br><span class="mono">'+e(i.vin)+'</span></div>'}).join('')+'</div>'+
  '<div class="bal"><div><small>PI amount</small><b>RM '+P.total+'</b></div><div><small>Received</small><b>RM '+P.paid+'</b></div><div><small>Balance</small><b>RM '+P.bal+'</b></div></div></div>';
 }else{
  head='<div class="card"><h3>Proforma Invoices — '+e(C.dealer)+'</h3><div style="font-size:13px;color:#4a5670;margin-bottom:8px">Paid several PIs with one transfer? Tick the PIs this slip covers and upload the slip once.</div>'+
  '<table><tr><th style="width:26px"><input type="checkbox" id="all" checked style="width:auto"></th><th>PI</th><th>Vehicle</th><th style="text-align:right">Balance (RM)</th></tr>'+
  C.pis.map(function(p,k){var st=p.fullyPaid?'<br><small style="color:#1f6b43">Fully paid</small>':p.pending?'<br><small style="color:#a6680b">Slip already received</small>':'';
   return '<tr><td><input type="checkbox" class="pk" data-k="'+k+'" '+(p.fullyPaid?'disabled':(p.pending?'':'checked'))+' style="width:auto"></td><td><b class="mono">'+e(p.no)+'</b>'+st+(p.outlet?'<br><small>'+e(p.outlet)+'</small>':'')+'</td><td>'+
   p.items.map(function(i){return e(i.model)+' · '+e(i.color)+'<br><span class="mono" style="font-size:11.5px">'+e(i.vin)+'</span>'}).join('<br>')+'</td><td style="text-align:right">'+p.bal+'</td></tr>'}).join('')+
  '</table><div class="bal"><div><small>PIs ticked</small><b id="nT">0</b></div><div><small>Total balance ticked</small><b id="sT">RM 0.00</b></div></div>'+
  (C.gone.length?'<div class="msg err" style="margin-top:10px">Cancelled and not shown: '+e(C.gone.join(', '))+'</div>':'')+'</div>';
 }
 A.innerHTML=head+
  (C.slips.length?'<div class="card"><h3>Slips already uploaded</h3><table><tr>'+(multi?'<th>PI</th>':'')+'<th>Uploaded</th><th>Amount (RM)</th><th>Ref</th><th>Status</th></tr>'+C.slips.map(function(s){return '<tr>'+(multi?'<td class="mono">'+e(s.pi)+'</td>':'')+'<td>'+e(s.ts)+'</td><td>'+e(s.amount)+'</td><td>'+e(s.ref)+'</td><td>'+e(s.status)+'</td></tr>'}).join('')+'</table></div>':'')+
  (!open.length?'<div class="card"><div class="msg ok">'+(multi?'These PIs are':'This PI is')+' fully paid. Thank you.</div></div>':
  '<div class="card" id="up"><h3>Upload payment slip'+(multi?' (one slip for all ticked PIs)':'')+'</h3><div class="row"><div><label>Payment date</label><input type="date" id="d" value="'+today+'"></div><div><label>Amount paid (RM)</label><input type="number" step="0.01" id="a" value="'+(multi?'':C.pis[0].balNum)+'"></div></div>'+
  '<div class="row"><div><label>Bank reference no.</label><input id="r"></div><div><label>Paying bank</label><input id="b"></div></div>'+
  '<label>Payment slip (PDF / image, max 10 MB)</label><input type="file" id="f" accept="image/*,application/pdf">'+
  '<label>Note (optional)</label><textarea id="n" rows="2"></textarea><button id="go">Submit payment slip</button><div id="m"></div></div>');
 function ticked(){if(!multi)return [C.pis[0].no];return Array.prototype.slice.call(document.querySelectorAll('.pk')).filter(function(x){return x.checked}).map(function(x){return C.pis[+x.dataset.k]})}
 function upd(){if(!multi)return;var t=ticked(),sum=t.reduce(function(a,p){return a+Number(p.balNum||0)},0);
  document.getElementById('nT').textContent=t.length;document.getElementById('sT').textContent='RM '+money(sum);
  var a=document.getElementById('a');if(a&&!a.dataset.manual)a.value=sum?sum.toFixed(2):'';
  var al=document.getElementById('all'),en=document.querySelectorAll('.pk:not(:disabled)');al.checked=t.length&&t.length===en.length;al.indeterminate=t.length>0&&t.length<en.length}
 if(multi){Array.prototype.forEach.call(document.querySelectorAll('.pk'),function(x){x.onchange=upd});
  document.getElementById('all').onchange=function(){var on=this.checked;Array.prototype.forEach.call(document.querySelectorAll('.pk:not(:disabled)'),function(x){x.checked=on});upd()};
  var ai=document.getElementById('a');if(ai)ai.oninput=function(){this.dataset.manual='1'};upd()}
 var go=document.getElementById('go');
